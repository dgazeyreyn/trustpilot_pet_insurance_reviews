name: Update README Preview Screenshot

on:
  # Runs automatically whenever a deployment or push to main happens
  push:
    branches:
      - main
  # Runs on a schedule (e.g., every Monday at midnight) to keep it fresh
  schedule:
    - cron: '0 0 * * 1'
  # Allows you to manually trigger the workflow anytime from the Actions tab
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    
    # Permissions required to commit the updated screenshot back to the repo
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shot-scraper
        run: |
          pip install shot-scraper
          shot-scraper install

      - name: Wait for GitHub Pages to build (Optional)
        # Gives your live site 30 seconds to update if triggered by a recent push
        if: github.event_name == 'push'
        run: sleep 30

      - name: Capture Screenshot
        run: |
          shot-scraper https://dgazeyreyn.github.io/trustpilot_pet_insurance_reviews/ \
            --width 1280 \
            --height 800 \
            --output assets/preview-screenshot.png

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Only commit if the screenshot actually changed
          git add assets/preview-screenshot.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated update of readme preview screenshot [skip ci]"
            git push
          else
            echo "No changes detected in screenshot."
          fi
